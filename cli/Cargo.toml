[package]
name = "openwhisper-cli"
version = "0.5.0"
edition = "2024"
license = "MIT"
authors = ["Jimmi Joensson"]
description = "Headless CLI for OpenWhisper. Same engine as the desktop app — record, transcribe, enumerate devices, inspect recognizer state, surface crash dumps."
publish = false

[[bin]]
name = "openwhisper"
path = "src/main.rs"

[dependencies]
# Same library the Tauri shell consumes. `recognizer` enables the
# in-core ASR path (FluidAudio on Mac via the Swift bridge,
# ort + Parakeet ONNX on Win/Linux).
openwhisper-core = { path = "../core", default-features = false, features = ["recognizer", "refine", "focus", "ask", "vision"] }
# clap derive keeps the parser definition close to the subcommand
# handlers and gives us --help + shell completion for free.
clap = { version = "4", features = ["derive"] }
# Rich error context across the I/O + recognizer call chain. Each
# subcommand handler returns `anyhow::Result<()>` so any error from
# core surfaces with a stack of `.context(...)` annotations.
anyhow = "1"
# JSON output for `--json` mode on every subcommand.
serde_json = "1"
# Resolves the OS-specific config dir so `cli settings` reads/writes
# the same settings.json the Tauri shell consumes
# (~/Library/Application Support/com.openwhisper.app/settings.json on
# Mac; %APPDATA%\com.openwhisper.app\settings.json on Windows).
dirs = "5"
# Local-time stamps in `openwhisper history`. Same version and
# features as core.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# The live pixel test of Vision (`cli/tests/vision_live.rs`) and its
# helper window, the hidden `openwhisper vision test-window`. The test
# captures the real screen outside an ask (through core's hook of the
# same feature) and reads a few pixels inside its own two windows. NOT
# a default feature, and it must stay that way: a build that ships has
# neither the hook nor the helper. Switched on only by the test's own
# command line:
#
#   OPENWHISPER_VISION_LIVE=1 cargo test -p openwhisper-cli --features vision-live-test --test vision_live -- --ignored --nocapture
[features]
vision-live-test = [
    "openwhisper-core/vision-live-test",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:windows",
]

# `openwhisper vision test-window` (feature `vision-live-test` only): a
# borderless window of one solid colour, shown with AppKit. Same
# versions as core.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSWindow", "NSColor", "NSGraphics", "NSScreen", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSGeometry", "objc2-core-foundation"] }

# The same helper window on Windows (feature `vision-live-test` only):
# a borderless topmost popup of one solid colour, through Win32. Same
# version as core.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# JSON parsing for the smoke test that asserts on `cli --json
# transcribe ...` output. Already a runtime dep; pulled in here
# explicitly so the test target sees it without lighting up the
# default-features path.
serde_json = "1"
